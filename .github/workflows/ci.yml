name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64
      - name: ANSI check
        run: make ansi-check
      - name: Tests
        run: make test
      - name: Linux console
        run: make linux
      - name: Windows console
        run: make windows WINCC=x86_64-w64-mingw32-gcc
