name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64
      - name: Build and test Linux + Windows consoles
        run: |
          make ansi-check test
          make linux windows
      - name: Prepare release assets
        run: |
          make release
      - name: Prepare release notes
        run: cp docs/releases/${GITHUB_REF_NAME}.md /tmp/release-notes.md
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          overwrite_files: true
          files: |
            dist-release/mote-posix-console
            dist-release/mote-windows-console.exe
            dist-release/SHA256SUMS
          body_path: /tmp/release-notes.md
