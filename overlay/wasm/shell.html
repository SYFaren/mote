<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mote — wasm</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #ccc;
      font: 14px/1.4 sans-serif;
    }
    #wrap {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    header {
      padding: 8px 12px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }
    header b { color: #8cf; }
    #stage {
      position: relative;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      background: #000;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    #status {
      position: absolute;
      right: 8px;
      bottom: 6px;
      padding: 2px 8px;
      font-size: 11px;
      color: #666;
      background: rgba(0,0,0,0.55);
      border-radius: 3px;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header><b>mote</b> · WebAssembly · click canvas, then type</header>
    <div id="stage">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
      <div id="status">loading…</div>
    </div>
  </div>
  <script>
    function fitCanvas() {
      var c = document.getElementById('canvas');
      var stage = document.getElementById('stage');
      if (!c || !stage) return;
      var w = Math.max(200, stage.clientWidth | 0);
      var h = Math.max(120, stage.clientHeight | 0);
      /* Keep drawing buffer == CSS box so the status strip is not clipped. */
      if (c.width !== w) c.width = w;
      if (c.height !== h) c.height = h;
      if (typeof Module !== 'undefined' && Module.setCanvasSize)
        Module.setCanvasSize(w, h, true);
    }
    var Module = {
      arguments: ['hello_mote.c'],
      canvas: (function(){ return document.getElementById('canvas'); })(),
      setStatus: function(t){
        var s = document.getElementById('status');
        if (s) s.textContent = t || '';
      },
      onRuntimeInitialized: function(){
        Module.setStatus('ready');
        fitCanvas();
        setTimeout(fitCanvas, 0);
        setTimeout(fitCanvas, 50);
      }
    };
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('load', fitCanvas);
  </script>
  {{{ SCRIPT }}}
</body>
</html>
